databases:
  - name: tmimer-plant-db
    plan: free

services:
  - type: web
    name: tmimer-plants
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn plants_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tmimer-plant-db
          property: connectionString
