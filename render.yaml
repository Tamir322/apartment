databases:
  - name: tmimer-plant-db
    databaseName: plants
    user: tmimer
    plan: free
    region: oregon

services:
  - type: web
    name: tmimer-plants
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn plants_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: tmimer-plant-db
          property: connectionString
